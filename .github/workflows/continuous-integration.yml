name: Deploy PoseidonGov

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t poseidongov-api .
          docker tag poseidongov-api:latest \
            599648822552.dkr.ecr.us-east-1.amazonaws.com/poseidongov-api:latest
          docker push \
            599648822552.dkr.ecr.us-east-1.amazonaws.com/poseidongov-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 100.51.21.135
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS \
              --password-stdin 599648822552.dkr.ecr.us-east-1.amazonaws.com
            docker stop $(docker ps -q) || true
            docker rm $(docker ps -aq) || true
            docker pull 599648822552.dkr.ecr.us-east-1.amazonaws.com/poseidongov-api:latest
            docker run -d --restart always -p 8000:8000 \
              --env-file /home/ec2-user/.env \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              599648822552.dkr.ecr.us-east-1.amazonaws.com/poseidongov-api:latest